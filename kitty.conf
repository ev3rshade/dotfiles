# ╔══════════════════════════════════════════════════════╗
# ║                  kitty.conf                          ║
# ╚══════════════════════════════════════════════════════╝

# ── Theme ────────────────────────────────────────────────
include ~/.config/kitty/themes/flexoki_dark.conf
#include Wryan.conf
#include VSCode_Dark.conf

# ── Transparency & Blur ──────────────────────────────────
background_opacity 0.5
# higher = smoother frosted-glass look
background_blur 32                      
# ── Terminal ─────────────────────────────────────────────
term xterm-kitty

# ── Bell ─────────────────────────────────────────────────
enable_audio_bell no

# ── Display Server ───────────────────────────────────────
# If GNOME is running in Wayland mode, switch to 'wayland'
# for proper blur/opacity compositing. Use 'x11' for pure X11.
linux_display_server wayland

# ── Font ─────────────────────────────────────────────────
font_family        FiraCode Nerd Font
bold_font          auto
italic_font        auto
bold_italic_font   auto
font_size 14.0

# ── Font Size Management ─────────────────────────────────
map ctrl+shift+equal        change_font_size all +1.0
map ctrl+shift+minus        change_font_size all -1.0
map ctrl+shift+backspace    change_font_size all 0

# ── Cursor ───────────────────────────────────────────────
cursor_shape block
cursor_blink_interval 0
cursor_stop_blinking_after 0
shell_integration no-cursor

# cursor trail animation
cursor_trail 200
cursor_trail_decay 0.1 0.4
cursor_trail_start_threshold 2

# ── Scrollback ───────────────────────────────────────────
scrollback_lines 10000
# MB on disk for very long sessions
scrollback_pager_history_size 10 
wheel_scroll_multiplier 3.0

# Scrollback search with fzf
map ctrl+shift+f launch --type=overlay --stdin-source=@screen_scrollback /usr/bin/fzf --no-sort --no-mouse -i

# ── Mouse ────────────────────────────────────────────────
mouse_hide_wait -1

# ── Performance ──────────────────────────────────────────
sync_to_monitor yes
repaint_delay 8
input_delay 1

# ── Window Layout ────────────────────────────────────────
remember_window_size  no
initial_window_width  1280
initial_window_height 800

window_border_width 1.5pt
window_padding_width 6
window_margin_width 2
hide_window_decorations yes

enabled_layouts tall,stack,fat,grid,splits

# ── Window Management ────────────────────────────────────
map ctrl+shift+enter    new_window
map ctrl+shift+]        next_window
map ctrl+shift+[        previous_window
map ctrl+shift+r        start_resizing_window

# move windows
map ctrl+shift+up       move_window up
map ctrl+shift+down     move_window down

# navigate neighboring windows (great with splits layout)
map ctrl+alt+up         neighboring_window up
map ctrl+alt+down       neighboring_window down
map ctrl+alt+left       neighboring_window left
map ctrl+alt+right      neighboring_window right

# splits
map ctrl+shift+h        launch --location=vsplit
map ctrl+shift+v        launch --location=hsplit

# ── Layout Management ────────────────────────────────────
map ctrl+shift+l    next_layout
map ctrl+alt+r      goto_layout tall
map ctrl+alt+s      goto_layout stack

# ── Tab Bar ──────────────────────────────────────────────
tab_bar_style powerline
tab_powerline_style round
tab_bar_edge bottom
tab_bar_align left
# hide tab bar when only one tab open
tab_bar_min_tabs 2                      
active_tab_font_style   bold-italic
inactive_tab_font_style normal

# ── Tab Management ───────────────────────────────────────
map ctrl+shift+t        new_tab
map ctrl+shift+right    next_tab
map ctrl+shift+left     previous_tab
map ctrl+shift+q        close_tab

# jump directly to tab by number
map ctrl+alt+1  goto_tab 1
map ctrl+alt+2  goto_tab 2
map ctrl+alt+3  goto_tab 3
map ctrl+alt+4  goto_tab 4

# ── Clipboard ────────────────────────────────────────────
map ctrl+shift+c    copy_to_clipboard
map ctrl+shift+v    paste_from_clipboard
